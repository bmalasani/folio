[project]
name = "one-shot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "playground",
]

[tool.uv.workspace]
members = [
    "apps/*",
    "libs/*",
    "playground",
]

[tool.uv.sources]
playground = { workspace = true }


[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
